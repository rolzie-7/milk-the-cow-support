# Keeps the free-tier Supabase project from being paused for inactivity.
# Supabase pauses Free Plan projects with too few database queries over 7 days,
# so this makes a small read-only REST request once a day.
# Public repo => GitHub-hosted runner minutes are free.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://zsdldffljgoxthqklsfr.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Response body is discarded so no row data ends up in the logs.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/users?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "REST status: $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "Supabase did not respond normally (maybe already paused)."
            exit 1
          fi
